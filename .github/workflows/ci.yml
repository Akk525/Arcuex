name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Solidity deps
        run: forge install --no-git foundry-rs/forge-std@rev=f3dae6e6ee381f25eb6a246f7da9b85c91a68219 OpenZeppelin/openzeppelin-contracts@rev=acd4ff74de833399287ed6b31b4debf6b2b35527
        working-directory: contracts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Test contracts
        run: pnpm test:contracts

      - name: Test reconciliation supervisor state
        run: node --test deploy/railway/reconciliation-state.test.cjs deploy/railway/candidate-isolation.test.cjs

      - name: Build
        run: pnpm build
