name: Bug
description: Something broken in the foundation
title: "bug: "
labels: ["priority:p1"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test commands
      value: |
        pnpm test
        pnpm typecheck
