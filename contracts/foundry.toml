[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fmt]
line_length = 100

# Arc Testnet deployment defaults (do not use mainnet).
[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
